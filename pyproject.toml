[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-demand-intelligence"
version = "1.0.3"
description = "Retail demand forecasting and inventory-risk analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sebastian Garay" }]
dependencies = [
    "fastapi>=0.115",
    "lightgbm>=4.6",
    "pandas>=2.2",
    "pyarrow>=18,<25",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "scikit-learn>=1.6",
    "streamlit>=1.41",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
retail-demand = "retail_demand.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pandas-stubs>=2.2",
    "pip-audit>=2.10.1",
    "pre-commit>=4.0,<4.6",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "scikit-learn-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retail_demand"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
